# Releases are made by hand (Actions > Release > Run workflow). The version comes from the titles of the
# pull requests merged since the last release (`breaking`, `feature`, `fix`, `chore`: see
# scripts/next-version.sh); "publish" off is a dry run that builds the tarball and publishes nothing.
#
# The tarball is built on the oldest distribution we still support (so its glibc is the lowest any
# supported user has), with SDL3 linked statically. Move the container forward when its distribution
# reaches end of life (Ubuntu 22.04: spring 2027).
name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Tag the commit and publish the release (off: build only)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: next
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [[ "${PUBLISH}" == "true" && "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Only main can be published; run the workflow on main."
            exit 1
          fi
          # Prints nothing (and fails) when only chores were merged since the last release.
          next="$(scripts/next-version.sh || true)"
          if [[ -z "${next}" && "${PUBLISH}" == "true" ]]; then
            echo "::error::Nothing merged since the last release calls for one (only chores)."
            exit 1
          fi
          echo "Next version: ${next:-none, a dry run is built as 0.0.0}"
          echo "version=${next:-0.0.0}" >> "${GITHUB_OUTPUT}"

  linux-tarball:
    name: Linux x86_64 tarball
    needs: version
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: System packages
        run: >-
          apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
          build-essential cmake pkg-config git curl ca-certificates zstd binutils libasound2-dev libudev-dev
          libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxfixes-dev libxss-dev libxtst-dev
          libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libdrm-dev libgbm-dev
          libgl-dev libegl-dev libvulkan-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Rust and cargo-about
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install
          cargo install cargo-about --locked --features cli
      - name: Stamp the version
        run: scripts/stamp-version.sh "${{ needs.version.outputs.version }}"
      - name: Build the tarball
        env:
          CARGO_FEATURES: --features bundled-sdl3
          OPENTBOI_STAMPED_VERSION: "1"
        run: scripts/package-linux-tarball.sh
      - name: Check what the binary needs from the system
        run: |
          tar --zstd -xf target/dist/*.tar.zst -C /tmp
          ldd /tmp/opentboi-*/bin/opentboi
          objdump -T /tmp/opentboi-*/bin/opentboi | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-tarball
          path: target/dist/*
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: ${{ inputs.publish }}
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: target/dist/*
