# Builds the Linux tarball on the oldest distribution we still support (so its glibc is the lowest
# any supported user has), with SDL3 linked statically, and attaches it to the release.
# Move the container forward when its distribution reaches end of life (Ubuntu 22.04: spring 2027).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-tarball:
    name: Linux x86_64 tarball
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: System packages
        run: >-
          apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
          build-essential cmake pkg-config git curl ca-certificates zstd binutils libasound2-dev libudev-dev
          libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxfixes-dev libxss-dev libxtst-dev
          libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libdrm-dev libgbm-dev
          libgl-dev libegl-dev libvulkan-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Rust and cargo-about
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo install cargo-about --locked --features cli
      - name: Build the tarball
        run: CARGO_FEATURES="--features bundled-sdl3" scripts/package-linux-tarball.sh
      - name: Check what the binary needs from the system
        run: |
          tar --zstd -xf target/dist/*.tar.zst -C /tmp
          ldd /tmp/opentboi-*/bin/opentboi
          objdump -T /tmp/opentboi-*/bin/opentboi | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: target/dist/*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: target/dist/*
