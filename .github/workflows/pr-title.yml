# Pull requests are squash-merged and the commit takes the pull request's title, so the title carries
# the kind of change: `breaking`, `feature`, `fix` or `chore`, then a colon (`fix: boss door stays shut`).
# The release workflow works the next version out from those (the semantic-version step of release.yml).
name: Pull request title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    name: Pull request title has a semver tag
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            breaking
            feature
            fix
            chore
          requireScope: false
