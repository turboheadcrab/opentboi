# Pull requests are squash-merged and the commit takes the pull request's title, so the title carries
# the kind of change: `breaking`, `feature`, `fix` or `chore`, then a colon (`fix: boss door stays shut`).
# The release workflow works the next version out from those (scripts/next-version.sh).
name: Pull request title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    name: Pull request title has a semver tag
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            breaking
            feature
            fix
            chore
          requireScope: false
