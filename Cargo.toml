[package]
name = "opentboi"
version = "0.1.0"
edition = "2024"
description = "An open-source engine for the original The Binding of Isaac that reads its art and sound from your own Steam copy"
license = "GPL-3.0-or-later"
repository = "https://github.com/turboheadcrab/opentboi"
readme = "README.md"
# Not for crates.io (it is a game, not a library); also keeps `cargo about` from listing us as third party.
publish = false

[features]
# Exactly the frontends compiled in; `--frontend` picks one at launch when both are.
default = ["sdl3-frontend"]
sdl3-frontend = ["dep:sdl3", "dep:symphonia"]
bevy-frontend = ["dep:bevy", "dep:winit"]
# Builds SDL3 from source and links it statically (needs cmake and a C compiler): for distributions
# without an SDL3 package (Ubuntu 24.04, Debian 12) and for the portable release binary.
bundled-sdl3 = ["sdl3-frontend", "sdl3/build-from-source-static"]

[dependencies]
# Only what the game uses; Bevy's "2d" bundle would add scenes, picking, UI, text, gizmos,
# animation and post-processing.
bevy = { version = "0.20", optional = true, default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_log",
    "bevy_window",
    "bevy_winit",
    "x11",
    "wayland",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_camera",
    "bevy_image",
    "bevy_color",
    "bevy_sprite",
    "bevy_sprite_render",
    "keyboard",
    "mouse",
    "gamepad",
    "bevy_gilrs",
    "bevy_audio",
    "mp3",
] }
flate2 = "1.1"
# The version Bevy's math types are (Bevy 0.20 uses 0.33): the Bevy frontend mixes the two.
glam = "0.33"
steamlocate = "2.1"
# Ruffle's SWF parser; the cached SWF is already uncompressed, so no codec features are needed.
swf = { version = "0.3", default-features = false }
# Shape tessellation for drawing vectors (behind `vector_mesh::ShapeMesher`, so it can be
# replaced). Not on crates.io; pinned to one commit, the same one `swf` comes from.
ruffle_render = { git = "https://github.com/ruffle-rs/ruffle", rev = "2372a4e1", default-features = false, features = ["tessellator"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
# Load libwayland at runtime: no wayland-devel at build time, and X11-only systems need no libwayland.
winit = { version = "0.30", optional = true, default-features = false, features = ["wayland-dlopen"] }
# Links the system SDL3 (Fedora: SDL3-devel to build, SDL3 to run).
sdl3 = { version = "0.20", optional = true }
# Pure-Rust MP3 decoding for the SDL3 frontend (Bevy decodes its own audio).
symphonia = { version = "0.5", optional = true, default-features = false, features = ["mp3"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[lints.rust]
# The only `unsafe` is a few calls into SDL that its safe wrapper lacks; each is allowed where it
# stands, with the reason.
unsafe_code = "deny"

[lints.clippy]
# Every `unsafe` block says why it is sound.
undocumented_unsafe_blocks = "warn"
# Clippy's stricter group; exceptions are listed below with their reason.
pedantic = { level = "warn", priority = -1 }
# Counts, sizes and indices become `f32`, the game's own precision; every one is far below 2^24,
# where `f32` stops holding whole numbers exactly.
cast_precision_loss = "allow"
# Keep functions reviewable; threshold lives in clippy.toml.
too_many_lines = "warn"
# Full, descriptive identifiers; allowed short names live in clippy.toml.
min_ident_chars = "warn"

[dev-dependencies]
# Same decoder Bevy's audio uses; lets tests prove extracted clips actually decode.
rodio = { version = "0.23", default-features = false, features = ["mp3"] }
# Writes rendered art to PNG in opt-in tests for visual comparison (already used by Bevy).
png = "0.18"
# Reads our own Rust sources in the opt-in test that looks for the original's arithmetic in them.
syn = { version = "3", default-features = false, features = ["full", "parsing", "visit", "proc-macro"] }

# `swf` from the same Ruffle commit as `ruffle_render`, so both use the same shape types.
[patch.crates-io]
swf = { git = "https://github.com/ruffle-rs/ruffle", rev = "2372a4e1" }

[package.metadata.cargo-machete]
# Named only to switch on its `wayland-dlopen` feature for the Bevy frontend (feature unification).
ignored = ["winit"]
