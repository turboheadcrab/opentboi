# Settings for `cargo deny check`: which licences, sources and advisories the dependencies may bring.
# The accepted licences are the ones about.toml accepts (checked to be compatible with
# GPL-3.0-or-later); keep the two lists in step.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# Not every accepted licence is in use at any time.
unused-allowed-license = "allow"
# This project itself (`publish = false`) is not third-party.
private = { ignore = true }

[advisories]
# Vulnerabilities, unmaintained and yanked crates fail the check.
unmaintained = "workspace"
yanked = "deny"

[bans]
# Several versions of a crate in the tree are common with Bevy and SDL; they are listed, not refused.
multiple-versions = "warn"
# The only dependency without a version is the pinned Ruffle commit (a `rev`, which is exact).
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Ruffle's shape tessellator and the `swf` crate come from one pinned commit (Cargo.toml), and the
# tessellator pulls in Ruffle's h263 decoder from its own pinned commit.
allow-git = ["https://github.com/ruffle-rs/ruffle", "https://github.com/ruffle-rs/h263-rs"]
