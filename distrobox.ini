# The development container, for systems without the build packages on the host (Bazzite, SteamOS,
# Fedora Silverblue and other immutable systems): Fedora with every package README.md names, for
# both frontends and the bundled SDL3 build (the desktop launchers build with `--all-features`).
# Your home directory is shared, so the rustup toolchain in ~/.cargo and the cache are used as they are.
#
# Create or recreate it: `mise run dev-box` (or `distrobox assemble create --file distrobox.ini`).
# The `mise run` tasks use it when it exists. Another distribution would be another section here.

[opentboi-dev]
image=registry.fedoraproject.org/fedora-toolbox:44
pull=true
replace=true
init=false
# The SDL3 frontend from Fedora's SDL3, and the Bevy frontend.
additional_packages="gcc SDL3-devel alsa-lib-devel systemd-devel"
# SDL3 built from source (`--features bundled-sdl3`): its build tools and the window system's headers.
additional_packages="cmake make wayland-devel wayland-protocols-devel libxkbcommon-devel libX11-devel"
additional_packages="libXext-devel libXcursor-devel libXi-devel libXrandr-devel libXfixes-devel"
additional_packages="libXScrnSaver-devel libXtst-devel libdecor-devel mesa-libEGL-devel mesa-libgbm-devel"
additional_packages="libdrm-devel mesa-libGL-devel pipewire-devel pulseaudio-libs-devel dbus-devel"
# `scripts/install-desktop-entries.sh` refreshes the menu with `update-desktop-database`.
additional_packages="desktop-file-utils"
