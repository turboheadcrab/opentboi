too-many-lines-threshold = 50
# Two-letter names like `dt` are flagged too; coordinates are the only exception.
min-ident-chars-threshold = 2
allowed-idents-below-min-chars = ["x", "y", "z"]
# Names that doc comments use as words, not code: the SWF's tag, the language, products and tools.
doc-valid-idents = ["DoAction", "ActionScript", "PlayStation", "FFDec", "XInput", "OpenTBOI", "AppID", ".."]
